[project]
name = "smart-campus-energy-optimizer"
version = "0.1.0"
description = "LLM-assisted 24-hour campus energy optimizer (GridWise BUP CSE Fest 2026)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
